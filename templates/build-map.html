<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build Map</title>
<!--
  Build map: every issue as a card, left → right in waves (an issue sits one wave after its last blocker),
  one row per area. Hover = its chain. Click = details (needs first / unlocks next).
  To update: replace CONFIG and the DATA array (output of templates/build-map-data.sh). Nothing else.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F9FBFC; --card:#FFFFFF; --secondary:#F3F6F9; --fg:#121A24; --muted:#566373; --faint:#7A8796;
  --border:#E4E9EF; --input:#D2DAE2; --primary:#1E6EBE; --primary-soft:#EFF6FD;
  --done:#1C7C54; --done-soft:#E9F5EF; --warn:#96600F; --warn-soft:#FBF3E4;
  --ready:#0E7C86; --ready-soft:#E6F5F6; --blocked:#8A96A3;
  --edge:#C9D3DD; --edge-done:#B9DCCB;
  --shadow:0 1px 2px rgba(18,26,36,.05),0 2px 8px rgba(18,26,36,.04);
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0A0F15; --card:#10171F; --secondary:#151E28; --fg:#E8EEF4; --muted:#98A6B5; --faint:#75828F;
  --border:#212C38; --input:#2E3B4A; --primary:#6CB2F0; --primary-soft:#12253A;
  --done:#4CC08D; --done-soft:#11261D; --warn:#E3A84B; --warn-soft:#2A2010;
  --ready:#4FC6CF; --ready-soft:#0F2729; --blocked:#6B7885;
  --edge:#2C3946; --edge-done:#1F3C30; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
header{padding:14px max(16px,env(safe-area-inset-left,0px)) 12px;border-bottom:1px solid var(--border);background:var(--card);display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
.progress{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;flex:1;min-width:200px}
.bar{flex:1;max-width:280px;height:6px;border-radius:99px;background:var(--secondary);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card);border-radius:99px;padding:4px 11px 4px 9px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip b{font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}
.chip[aria-pressed="false"]{opacity:.45}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.sep{width:1px;height:22px;background:var(--border);margin:0 4px}
select,input[type=search]{border:1px solid var(--input);background:var(--card);border-radius:10px;padding:5px 10px;font-size:13px;height:32px;box-sizing:border-box}
input[type=search]{width:170px}
.zoom{margin-left:auto;display:flex;gap:4px}
.zoom button{width:32px;height:32px;border:1px solid var(--border);background:var(--card);border-radius:10px;cursor:pointer}
main{flex:1;display:flex;min-height:0}
#canvas{flex:1;overflow:auto;position:relative;cursor:grab;min-width:0}
#canvas.dragging{cursor:grabbing;user-select:none}
#stage{position:relative;transform-origin:0 0}
#world{position:absolute;left:0;top:0}
svg#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.lane{position:absolute;left:0;border-radius:16px;pointer-events:none}
.lane.alt{background:var(--secondary)}
.lanelab{position:absolute;left:16px;top:18px;width:140px;display:flex;flex-direction:column;gap:2px}
.lanelab b{font-size:16px;font-weight:600}
.lanelab span{font-size:12px;color:var(--muted);line-height:1.35}
.lanelab em{font:500 11.5px var(--mono);font-style:normal;color:var(--faint);margin-top:8px}
.lanelab i{display:block;width:120px;height:4px;border-radius:99px;margin-top:5px;background:linear-gradient(90deg,var(--done) var(--p),var(--border) var(--p))}
.wave{position:absolute;font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.wave span{color:var(--muted)}
.node{position:absolute;width:228px;height:54px;box-sizing:border-box;border:1px solid var(--border);background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:7px 10px 7px 12px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left;transition:opacity .18s}
.node .meta{display:flex;align-items:center;gap:6px;font:500 11px/1.2 var(--mono);color:var(--faint)}
.node .meta .num{color:var(--muted)}
.node .meta .tag{margin-left:auto;font-family:var(--font);font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:99px}
.node .t{font-size:12.5px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.node.done{background:var(--done-soft);border-color:transparent;box-shadow:none}
.node.done .t,.node.blocked .t{color:var(--muted)}
.node.progress{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.node.ready{border-color:var(--ready)}
.node.hitl{border-color:var(--warn);background:var(--warn-soft)}
.node.sel{outline:2px solid var(--fg);outline-offset:2px}
.node.dim{opacity:.18}
.node.hidden{display:none}
.tag.done{color:var(--done)} .tag.progress{background:var(--primary-soft);color:var(--primary)}
.tag.ready{background:var(--ready-soft);color:var(--ready)} .tag.hitl{color:var(--warn)} .tag.blocked{color:var(--faint)}
path.e{fill:none;stroke:var(--edge);stroke-width:1.4}
path.e.fromdone{stroke:var(--edge-done)}
path.e.up{stroke:var(--warn);stroke-width:2}
path.e.down{stroke:var(--primary);stroke-width:2}
path.e.dim{opacity:.08} path.e.hidden{display:none}
aside{width:340px;flex:none;border-left:1px solid var(--border);background:var(--card);overflow:auto;padding:18px;box-sizing:border-box}
aside h2{font-size:17px;font-weight:600;margin:0 0 4px;line-height:1.3}
aside h3{font:600 11px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:20px 0 8px}
aside p{margin:0;color:var(--muted);font-size:13.5px}
.list{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.list button{width:100%;display:flex;align-items:flex-start;gap:8px;border:0;background:transparent;padding:6px 8px;margin:0 -8px;border-radius:8px;cursor:pointer;text-align:left;font-size:13px;line-height:1.35}
.list button:hover{background:var(--secondary)}
.list .num{font:500 11.5px/1.35 var(--mono);color:var(--faint);flex:none;min-width:30px}
.list .dot{margin-top:5px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;margin:8px 0 4px;background:var(--secondary)}
.kv{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kv span{font-size:12px;border:1px solid var(--border);border-radius:99px;padding:2px 9px;color:var(--muted)}
a.gh{display:inline-flex;margin-top:14px;font-size:13.5px;font-weight:500;color:var(--primary);text-decoration:none}
.hint{font-size:12.5px;color:var(--faint);margin-top:16px}
.back{border:0;background:none;color:var(--primary);cursor:pointer;padding:0;font-size:13px;margin-bottom:12px}
.empty{color:var(--faint);font-size:13px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:18px;height:2px;vertical-align:middle;margin-right:5px}
@media (max-width:820px){main{flex-direction:column} aside{width:auto;height:38%;border-left:0;border-top:1px solid var(--border)} .zoom{margin-left:0} .sep{display:none}}
</style>
</head>
<body>
<header>
  <div class="top"><h1 id="title"></h1><div class="progress"><div class="bar" id="bar"></div><span id="ptext"></span></div></div>
  <div class="tools">
    <div id="chips" style="display:contents"></div>
    <span class="sep"></span>
    <select id="area" aria-label="Filter by area"><option value="">All areas</option></select>
    <input id="q" type="search" placeholder="Search #num or title" aria-label="Search issues">
    <div class="zoom"><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Fit">⤢</button><button id="zin" aria-label="Zoom in">+</button></div>
  </div>
</header>
<main>
  <div id="canvas"><div id="stage"><div id="world"><svg id="edges"></svg></div></div></div>
  <aside id="panel"></aside>
</main>
<script>
/* ===== EDIT ME ===== */
const CONFIG = {
  title: "Build map",
  repo: "https://github.com/OWNER/REPO",
  updated: "",            // e.g. "17 Nov, 10:30"
  // Optional rows, in order: [areaLabel, name, subtitle]. Empty = one row per area found in DATA.
  lanes: []
};
// From templates/build-map-data.sh. Fields: n number, t title, st done|progress|ready|hitl|blocked,
// a areas, h needs-human, g decision ticket, b blocker numbers, pr [[prNumber, 1 merged | 0 open | -1 closed]].
const DATA = [];
/* =================== */

const ST={done:{label:"Done",c:"var(--done)"},progress:{label:"In progress",c:"var(--primary)"},ready:{label:"Ready",c:"var(--ready)"},hitl:{label:"Needs you",c:"var(--warn)"},blocked:{label:"Blocked",c:"var(--blocked)"}};
const ORDER=["done","progress","ready","hitl","blocked"];
document.getElementById("title").textContent=CONFIG.title; document.title=CONFIG.title;
const byN=new Map(DATA.map(d=>[d.n,d]));
DATA.forEach(d=>{d.b=d.b.filter(b=>byN.has(b)); d.u=[];});
DATA.forEach(d=>d.b.forEach(b=>byN.get(b).u.push(d.n)));

/* layout: rows = areas, columns = waves */
const W=228,H=56,GX=120,GY=16,LABELW=170,PADX=24,TOP=56,LPAD=22,LGAP=14;
const counts={}; DATA.forEach(d=>(d.a.length?d.a:["other"]).forEach(a=>counts[a]=(counts[a]||0)+1));
const LANES=CONFIG.lanes.length?CONFIG.lanes:Object.keys(counts).sort((x,y)=>counts[y]-counts[x]).map(k=>[k,k[0].toUpperCase()+k.slice(1),""]);
const laneKeys=LANES.map(l=>l[0]);
DATA.forEach(d=>d.lane=laneKeys.find(k=>d.a.includes(k))||(d.a.length?laneKeys.find(k=>k===d.a[0]):null)||laneKeys[laneKeys.length-1]);
const memo={};
function depth(n){ if(n in memo) return memo[n]; memo[n]=0; const d=byN.get(n); return memo[n]=d.b.length?1+Math.max(...d.b.map(depth)):0; }
DATA.forEach(d=>d.d=depth(d.n));
const maxD=Math.max(0,...DATA.map(d=>d.d));
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const laneInfo=LANES.filter(([k])=>DATA.some(d=>d.lane===k)).map(([k,name,sub])=>{
  const rows=Math.max(...[...Array(maxD+1)].map((_,w)=>DATA.filter(d=>d.lane===k&&d.d===w).length));
  return {k,name,sub,rows,h:LPAD*2+rows*H+(rows-1)*GY};
});
let yy=TOP; laneInfo.forEach(l=>{l.y=yy; yy+=l.h+LGAP;});
const colX=w=>LABELW+PADX+w*(W+GX);
for(let w=0;w<=maxD;w++) laneInfo.forEach(l=>{
  const cell=DATA.filter(d=>d.lane===l.k&&d.d===w);
  cell.forEach(d=>d.bc=avg(d.b.map(b=>byN.get(b).y))??(l.y+d.n));
  cell.sort((a,b)=>a.bc-b.bc||a.n-b.n);
  cell.forEach((d,i)=>{d.x=colX(w); d.y=l.y+LPAD+i*(H+GY);});
});
const worldW=colX(maxD)+W+PADX*2, worldH=yy+12;

/* render */
const world=document.getElementById("world"), svg=document.getElementById("edges"), stage=document.getElementById("stage");
world.style.width=worldW+"px"; world.style.height=worldH+"px"; svg.setAttribute("width",worldW); svg.setAttribute("height",worldH);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
laneInfo.forEach((l,i)=>{
  const band=document.createElement("div"); band.className="lane"+(i%2?" alt":"");
  Object.assign(band.style,{top:l.y+"px",height:l.h+"px",width:worldW+"px"});
  const items=DATA.filter(d=>d.lane===l.k), done=items.filter(d=>d.st==="done").length;
  band.innerHTML=`<div class="lanelab"><b>${esc(l.name)}</b><span>${esc(l.sub)}</span><em>${done}/${items.length} done</em><i style="--p:${done/items.length*100}%"></i></div>`;
  world.appendChild(band);
});
for(let k=0;k<=maxD;k++){
  const w=document.createElement("div"); w.className="wave";
  const open=DATA.filter(d=>d.d===k&&d.st!=="done").length;
  w.innerHTML=`Wave ${k+1} <span>· ${open?open+" open":"all done"}</span>`;
  w.style.left=(colX(k)+2)+"px"; w.style.top="22px"; world.appendChild(w);
}
world.appendChild(svg);
const edgeEls=[];
DATA.forEach(d=>d.b.forEach(b=>{
  const s=byN.get(b), p=document.createElementNS("http://www.w3.org/2000/svg","path");
  const x1=s.x+W,y1=s.y+H/2,x2=d.x,y2=d.y+H/2,mx=(x2-x1)*.5;
  p.setAttribute("d",`M${x1},${y1} C${x1+mx},${y1} ${x2-mx},${y2} ${x2},${y2}`);
  p.setAttribute("class","e"+(s.st==="done"?" fromdone":""));
  svg.appendChild(p); edgeEls.push({el:p,from:b,to:d.n});
}));
const tagText={done:"✓ done",progress:"PR open",ready:"ready",hitl:"needs you",blocked:"blocked"};
DATA.forEach(d=>{
  const el=document.createElement("button"); el.className="node "+d.st; el.type="button";
  el.style.left=d.x+"px"; el.style.top=d.y+"px";
  el.innerHTML=`<div class="meta"><span class="num">#${d.n}</span>${d.a.slice(0,2).map(a=>`<span>${esc(a)}</span>`).join("")}<span class="tag ${d.st}">${tagText[d.st]}</span></div><div class="t">${esc(d.t)}</div>`;
  el.setAttribute("aria-label",`#${d.n} ${d.t}, ${ST[d.st].label}`);
  el.addEventListener("mouseenter",()=>{ if(selected==null) highlight(d.n); });
  el.addEventListener("mouseleave",()=>{ if(selected==null) highlight(null); });
  el.addEventListener("click",e=>{ e.stopPropagation(); if(!moved) select(d.n); });
  world.appendChild(el); d.el=el;
});

/* graph walks */
function walk(n,key){ const seen=new Set(), st=[n]; while(st.length){ byN.get(st.pop())[key].forEach(y=>{ if(!seen.has(y)){seen.add(y); st.push(y);} }); } return seen; }
let selected=null;
function highlight(n){
  if(n==null){ DATA.forEach(d=>d.el.classList.remove("dim","sel")); edgeEls.forEach(e=>e.el.classList.remove("dim","up","down")); return; }
  const up=walk(n,"b"), down=walk(n,"u");
  DATA.forEach(d=>{ d.el.classList.toggle("dim",!(d.n===n||up.has(d.n)||down.has(d.n))); d.el.classList.toggle("sel",d.n===n&&selected===n); });
  edgeEls.forEach(e=>{
    const isUp=(e.to===n||up.has(e.to))&&up.has(e.from), isDown=(e.from===n||down.has(e.from))&&down.has(e.to);
    e.el.classList.toggle("up",isUp); e.el.classList.toggle("down",isDown&&!isUp); e.el.classList.toggle("dim",!isUp&&!isDown);
  });
  edgeEls.filter(e=>!e.el.classList.contains("dim")).forEach(e=>svg.appendChild(e.el));
}

/* side panel */
const panel=document.getElementById("panel");
const item=d=>`<li><button data-n="${d.n}"><span class="dot" style="background:${ST[d.st].c}"></span><span class="num">#${d.n}</span><span>${esc(d.t)}</span></button></li>`;
const list=(arr,empty)=>arr.length?`<ul class="list">${arr.map(item).join("")}</ul>`:`<p class="empty">${empty}</p>`;
function overview(){
  const g=s=>DATA.filter(d=>d.st===s).sort((a,b)=>walk(b.n,"u").size-walk(a.n,"u").size||a.n-b.n);
  panel.innerHTML=`<h2>What can move now</h2><p>Hover a card to see its chain. Click it for details. Left to right = order of work.</p>
    <div class="legend"><span><i style="background:var(--warn)"></i>needs first</span><span><i style="background:var(--primary)"></i>unlocks next</span></div>
    <h3>In progress · PR open</h3>${list(g("progress"),"Nothing in review.")}
    <h3>Ready · comment “@claude do this”</h3>${list(g("ready"),"Nothing ready right now.")}
    <h3>Needs you</h3>${list(g("hitl"),"Nothing waiting on you.")}
    <p class="hint">Sorted by how many tasks each one unblocks down the chain.</p>`;
}
function detail(n){
  const d=byN.get(n), blockers=d.b.map(x=>byN.get(x)), unlocks=d.u.map(x=>byN.get(x));
  const openB=blockers.filter(x=>x.st!=="done");
  const direct=unlocks.filter(u=>u.st!=="done"&&u.b.every(b=>b===n||byN.get(b).st==="done"));
  const total=walk(n,"u").size;
  const prs=d.pr.map(([p,m])=>`<span>PR #${p} · ${m===1?"merged":m===0?"open":"closed"}</span>`).join("");
  const why={blocked:`<p>Waiting on ${openB.length} task${openB.length>1?"s":""}.</p>`,ready:`<p>All blockers are done. Comment <b>@claude do this</b> on the issue to start.</p>`,hitl:`<p>Unblocked, but it needs you (account, secret or decision).</p>`,progress:`<p>A PR is open. Review and merge it.</p>`}[d.st]||"";
  panel.innerHTML=`<button class="back" id="back">← Overview</button>
    <div style="font:500 12px var(--mono);color:var(--faint)">#${d.n}</div><h2>${esc(d.t)}</h2>
    <span class="pill" style="color:${ST[d.st].c}"><span class="dot" style="background:${ST[d.st].c}"></span>${ST[d.st].label}</span>${why}
    <div class="kv">${d.a.map(a=>`<span>${esc(a)}</span>`).join("")}${d.h?"<span>hitl</span>":""}${d.g?"<span>grilling</span>":""}${prs}</div>
    <h3>Needs first (${blockers.length})</h3>${list(blockers,"Nothing. It can start any time.")}
    <h3>Unlocks next (${unlocks.length})</h3>${list(unlocks,"Nothing depends on it.")}
    ${unlocks.length&&d.st!=="done"?`<p class="hint">Finishing it frees ${direct.length} task${direct.length===1?"":"s"} right away, and ${total} in total down the chain.</p>`:""}
    <a class="gh" href="${CONFIG.repo}/issues/${d.n}" target="_blank" rel="noopener">Open on GitHub ↗</a>`;
  document.getElementById("back").onclick=()=>select(null);
}
panel.addEventListener("click",e=>{ const b=e.target.closest("button[data-n]"); if(b) select(+b.dataset.n,true); });
function select(n,scroll){ selected=n; highlight(n); if(n==null) return overview(); detail(n); if(scroll) centerOn(byN.get(n)); }

/* filters */
const active=new Set(ORDER), chips=document.getElementById("chips");
ORDER.forEach(s=>{
  const c=DATA.filter(d=>d.st===s).length; if(!c) return;
  const b=document.createElement("button"); b.className="chip"; b.type="button"; b.setAttribute("aria-pressed","true");
  b.innerHTML=`<span class="dot" style="background:${ST[s].c}"></span>${ST[s].label} <b>${c}</b>`;
  b.onclick=()=>{ active.has(s)?active.delete(s):active.add(s); b.setAttribute("aria-pressed",active.has(s)); applyFilters(); };
  chips.appendChild(b);
});
const areaSel=document.getElementById("area"), q=document.getElementById("q");
[...new Set(DATA.flatMap(d=>d.a))].sort().forEach(a=>{ const o=document.createElement("option"); o.value=a; o.textContent=a; areaSel.appendChild(o); });
function applyFilters(){
  const area=areaSel.value, text=q.value.trim().toLowerCase().replace(/^#/,""), vis=new Set();
  DATA.forEach(d=>{ const ok=active.has(d.st)&&(!area||d.a.includes(area))&&(!text||String(d.n)===text||d.t.toLowerCase().includes(text)); d.el.classList.toggle("hidden",!ok); if(ok) vis.add(d.n); });
  edgeEls.forEach(e=>e.el.classList.toggle("hidden",!(vis.has(e.from)&&vis.has(e.to))));
}
areaSel.onchange=applyFilters; q.oninput=applyFilters;
q.addEventListener("keydown",e=>{ if(e.key==="Enter"){ const v=DATA.find(d=>!d.el.classList.contains("hidden")); if(v) select(v.n,true);} });

/* progress */
const total=DATA.length||1, doneN=DATA.filter(d=>d.st==="done").length;
document.getElementById("bar").innerHTML=ORDER.filter(s=>s!=="blocked").map(s=>`<i style="width:${DATA.filter(d=>d.st===s).length/total*100}%;background:${ST[s].c}"></i>`).join("");
document.getElementById("ptext").textContent=`${Math.round(doneN/total*100)}% done · ${doneN} of ${DATA.length} tasks${CONFIG.updated?" · updated "+CONFIG.updated:""}`;

/* zoom + pan */
const canvas=document.getElementById("canvas"); let z=1;
function setZoom(nz,cx,cy){
  nz=Math.min(1.6,Math.max(.25,nz)); const r=canvas.getBoundingClientRect(); cx??=r.width/2; cy??=r.height/2;
  const wx=(canvas.scrollLeft+cx)/z, wy=(canvas.scrollTop+cy)/z;
  z=nz; stage.style.transform=`scale(${z})`; stage.style.width=worldW*z+"px"; stage.style.height=worldH*z+"px";
  canvas.scrollLeft=wx*z-cx; canvas.scrollTop=wy*z-cy;
}
function fit(){ const r=canvas.getBoundingClientRect(); setZoom(Math.min(r.width/worldW,r.height/worldH,1)); canvas.scrollLeft=0; canvas.scrollTop=0; }
function centerOn(d){ const r=canvas.getBoundingClientRect(); if(z<.7) setZoom(.85); canvas.scrollTo({left:(d.x+W/2)*z-r.width/2,top:(d.y+H/2)*z-r.height/2,behavior:"smooth"}); }
document.getElementById("zin").onclick=()=>setZoom(z*1.2);
document.getElementById("zout").onclick=()=>setZoom(z/1.2);
document.getElementById("zfit").onclick=fit;
canvas.addEventListener("wheel",e=>{ if(e.ctrlKey||e.metaKey){ e.preventDefault(); const r=canvas.getBoundingClientRect(); setZoom(z*(e.deltaY<0?1.1:1/1.1),e.clientX-r.left,e.clientY-r.top);} },{passive:false});
let drag=null, moved=false;
canvas.addEventListener("pointerdown",e=>{ if(e.pointerType!=="mouse"||e.button!==0) return; drag={x:e.clientX,y:e.clientY,l:canvas.scrollLeft,t:canvas.scrollTop}; moved=false; });
window.addEventListener("pointermove",e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>4){moved=true; canvas.classList.add("dragging");} canvas.scrollLeft=drag.l-dx; canvas.scrollTop=drag.t-dy; });
window.addEventListener("pointerup",()=>{ drag=null; canvas.classList.remove("dragging"); setTimeout(()=>moved=false,0); });
canvas.addEventListener("click",e=>{ if(!moved&&!e.target.closest(".node")&&selected!=null) select(null); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") select(null); });

overview();
requestAnimationFrame(()=>{ const r=canvas.getBoundingClientRect(); setZoom(Math.max(.55,Math.min(1,r.height/worldH))); canvas.scrollLeft=0; canvas.scrollTop=0; });
</script>
</body>
