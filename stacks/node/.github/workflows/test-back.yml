name: test-back

# Backend tests on PRs (no re-run on main after merge: they already ran on the PR).
# Runs only when back/ (or this file) changes. Other PRs cost 0 Actions minutes.
on:
  pull_request:
    paths:
      - 'back/**'
      - '.github/workflows/test-back.yml'

permissions:
  contents: read

concurrency:
  group: test-back-${{ github.ref }}
  cancel-in-progress: true

jobs:
  back:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: back/package-lock.json
      - run: npm ci
      - run: npm test
