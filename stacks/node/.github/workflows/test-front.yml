name: test-front

# Optional. Frontend lint + build (+ tests if you have some) on PRs.
# Runs only when front/ (or this file) changes.
on:
  pull_request:
    paths:
      - 'front/**'
      - '.github/workflows/test-front.yml'

permissions:
  contents: read

concurrency:
  group: test-front-${{ github.ref }}
  cancel-in-progress: true

jobs:
  front:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test --if-present
